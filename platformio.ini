; Tamagochi — PlatformIO configuration
; Target: ideaspark ESP8266 0.96" OLED Module V3.2 (ESP-12E)
;
; Versiones de librerías fijadas con ^ (minor/patch updates ok, major bloqueado):
;   - U8g2 @^2.35.30  : versión mínima probada con SSD1306 I2C full-buffer + XBM
;   - OneButton @^2.6.1: soporta short/long/double press con debounce configurable
;
; board_build.filesystem = littlefs — requerido desde Fase 1 (persistencia).
; Declarado ya en Fase 0 para no tener que reformat la flash después.
;
; upload_speed = 460800 — estable con CH340G a través de hub USB.
;   921600 funciona en conexión directa, pero falla con "Invalid head of packet" vía hub.
; f_cpu = 80000000L — 80MHz. No activar 160MHz: no hay ganancia real en render I2C
;   y aumenta el consumo innecesariamente (Fase 4 lo confirma con multímetro).

[env:esp12e]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D NDEBUG
    ; -I include: PlatformIO añade include/ al main.cpp pero NO a las libs.
    ;   DisplayRenderer necesita sprites_generated.h desde include/.
    -I include
    ; -Ilib/core/BatteryGauge: WebUI.h incluye BatteryGauge.h directamente (ver
    ; comentario de desacople WebUI/BatteryMonitor). El LDF en modo chain no
    ; siempre resuelve ese include de forma determinista cuando la cadena
    ; arranca en src/main.cpp (carrera con la compilación en paralelo) — mismo
    ; motivo por el que env:native ya declara este include explícito. Sin este
    ; flag, el build puede fallar intermitentemente con
    ; "BatteryGauge.h: No such file or directory".
    -Ilib/core/BatteryGauge
    ; -Ilib/core/MessageBox: mismo motivo que BatteryGauge — WebUI.h incluye
    ; MessageBox.h directamente (parámetro 6 del ctor) y el LDF en modo chain
    ; no siempre lo resuelve de forma determinista.
    -Ilib/core/MessageBox
; main_esp32.cpp (Arduino_GFX, ESP32-S3 only) excluido — no compila en ESP8266.
build_src_filter =
    +<*>
    -<main_esp32.cpp>
; lib_ignore: excluir DisplayRendererColor (depende de Arduino_GFX, solo ESP32).
; SpriteStore también depende de Arduino_GFX_Library (PSRAM, ps_malloc) — excluir.
; BootLoopGuard (hito 9): usa RTC_NOINIT_ATTR/esp_reset_reason (esp_system.h),
; APIs que no existen en el core ESP8266. WebUI.cpp lo incluye guardado tras
; #if defined(ARDUINO_ARCH_ESP32) (nunca se compila su código en esp12e), pero
; el LDF en modo chain detecta el #include de forma textual sin evaluar el
; guard de preprocesador, e intenta compilar la librería igualmente — lib_ignore
; es necesario para que no lo intente.
lib_ignore =
    DisplayRendererColor
    SpriteStore
    BootLoopGuard
; lib_extra_dirs expone los módulos internos al LDF para que los includes entre
; capas (p.ej. domain incluyendo Logger de core) se resuelvan correctamente.
lib_extra_dirs =
    lib/core
    lib/domain
    lib/ui
    lib/infra
lib_deps =
    olikraus/U8g2@^2.35.30
    mathertel/OneButton@^2.6.1
    bblanchon/ArduinoJson@^7.0.4
    ; ESPAsyncWebServer + dep ESPAsyncTCP — servidor HTTP async para Fase 3.
    ; URLs de GitHub directas (los nombres con espacios fallan en el LDF).
    https://github.com/me-no-dev/ESPAsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DLOG_LEVEL=0
    ; -I explícitos: el LDF de PlatformIO en env:native no resuelve includes
    ; entre módulos sin ayuda (lib_extra_dirs solo influye en lib_deps).
    -Ilib/core/Logger
    -Ilib/domain/Persistence
    -Ilib/domain/StatsEngine
    -Ilib/core/EventBus
    -Ilib/core/BatteryGauge
    -Ilib/core/MessageBox
    -Ilib/domain/LifeFSM
    -Ilib/infra/WebUI
    -Ilib/ui/BootSplashLogic
    -Ilib/ui/MarqueeLogic
    ; macOS only: fuerza la búsqueda de libc++ en el SDK de Xcode CLT para evitar
    ; conflictos con la libc++ del toolchain de PlatformIO en env:native.
    ; En Linux/CI la ruta no existe y el flag se ignora silenciosamente (tests pasan).
    -isystem /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/c++/v1
build_src_filter =
    +<*>
    -<main.cpp>
    -<main_esp32.cpp>
    -<../lib/infra/OTAManager/>
    -<../lib/infra/WifiManager/>
    -<../lib/infra/WebUI/WebUI.cpp>
    -<../lib/infra/BatteryMonitor/>
    -<../lib/ui/InputHandler/>
    -<../lib/ui/DisplayRenderer/>
    -<../lib/domain/Persistence/LittleFsStorage.cpp>
lib_compat_mode = off
; BootSplash usa Arduino_GFX — excluir de env:native.
; BootSplashLogic (sin GFX) sí se compila aquí para los tests unitarios.
lib_ignore =
    BootSplash
lib_extra_dirs =
    lib/core
    lib/domain
    lib/infra
    lib/ui
lib_deps =
    ; ArduinoJson v7 header-only: compatible con host-native para JsonCodec/tests.
    bblanchon/ArduinoJson@^7.0.4

[env:esp12e_turbo]
extends = env:esp12e
build_flags =
    ${env:esp12e.build_flags}
    -D TURBO_MODE
    -D TURBO_FACTOR=60

; OTA upload via WiFi — requiere placa conectada a la red y password en env var.
; Uso:  OTA_PASSWORD="tu_password" pio run -e esp12e_ota -t upload
; Si la password no está en la env var, esptool fallará con "auth failed".
[env:esp12e_ota]
extends = env:esp12e
upload_protocol = espota
upload_port = tamagotchi.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 — FASE 5: firmware de producción (WiFi + OTA + WebUI).
; Waveshare ESP32-S3 Zero, 4MB flash QIO, 2MB PSRAM quad.
;
; Flashear: pio run -e esp32s3 -t upload
;   Si el upload falla, poner placa en modo bootloader manual:
;   mantén presionado BOOT → pulsa RESET → suelta BOOT → correr pio upload.
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem101
upload_port = /dev/cu.usbmodem101
board_build.mcu = esp32s3
board_build.flash_mode = qio
; ── Flash size: el chip real es ESP32-S3FH4R2 = 4MB ──────────────────────────
; El board JSON (esp32-s3-devkitc-1) asume 8MB en DOS sitios:
;   - upload.flash_size = 8MB  → esptool lo estampa en el header de la imagen.
;   - build.partitions = default_8MB.csv → tabla de particiones de 8MB.
; Si solo se override board_build.flash_size, el header SIGUE en 8MB y al
; arrancar la ROM detecta flash(4MB) < header(8MB) → assert do_core_init →
; boot loop infinito (setup() NUNCA corre, pantalla negra). Hay que override
; AMBOS: el flash_size de upload Y la tabla de particiones a una de 4MB.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -I include
    ; -Ilib/core/BatteryGauge: ver comentario idéntico en env:esp12e — WebUI.h
    ; incluye BatteryGauge.h directamente y el LDF en modo chain no siempre lo
    ; resuelve de forma determinista partiendo de src/main_esp32.cpp.
    -Ilib/core/BatteryGauge
    ; -Ilib/core/MessageBox: mismo motivo — WebUI.h incluye MessageBox.h
    ; directamente (parámetro 6 del ctor).
    -Ilib/core/MessageBox
; Compila SOLO main_esp32.cpp — main.cpp (ESP8266) excluido.
build_src_filter = -<*> +<main_esp32.cpp>
; lib_ignore — módulos excluidos en ESP32-S3:
;   - DisplayRenderer : depende de U8g2 (solo ESP8266/OLED) — NO portar, archivos separados
;
; Módulos de red HABILITADOS en Fase 5 (salieron de lib_ignore):
;   WifiManager : portado a <WiFi.h> para ESP32 (condicional en el .cpp)
;   OTAManager  : portado; ArduinoOTA disponible en arduino-esp32; end() condicional
;   WebUI       : portado a esp32async/ESPAsyncWebServer + AsyncTCP
;
; Módulos HABILITADOS en Fases anteriores (siguen activos):
;   InputHandler: wrapper de OneButton — cross-platform
;   Logger    : header-only, portable
;   EventBus  : sin Arduino.h, puramente portable
;   StatsEngine: sin Arduino.h, portable
;   LifeFSM   : sin Arduino.h, portable
;   Persistence: LittleFsStorage.cpp usa <LittleFS.h> — disponible en esp32
lib_ignore =
    DisplayRenderer
lib_extra_dirs =
    lib/ui
    lib/core
    lib/domain
    lib/infra
lib_deps =
    ; GFX 1.3.7 (GitHub tag): última versión 1.3.x — compatible con framework 3.20017 (IDF 4.4.x).
    ; GFX 1.4.x+ introduce esp_private/periph_ctrl.h y bugs en Arduino_ESP32RGBPanel
    ; con core 2.x. Subir a >=1.4.x cuando se migre a Arduino-ESP32 core 3.x (IDF5).
    https://github.com/moononournation/Arduino_GFX.git#v1.3.7
    bblanchon/ArduinoJson@^7.0.4
    LittleFS
    mathertel/OneButton@^2.6.1
    ; ESP32-S3 Fase 5: AsyncWebServer mantenido para ESP32.
    ; NO usar me-no-dev (abandonado). Usar el fork mantenido esp32async.
    ; ESPAsyncWebServer + AsyncTCP (ESP32) — compatibles con arduino-esp32 core 2.x y 3.x.
    https://github.com/esp32async/ESPAsyncWebServer.git
    https://github.com/esp32async/AsyncTCP.git

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 TURBO — Fase 4 validación de ciclo de vida acelerado.
; Hereda TODO de env:esp32s3 y añade TURBO_MODE + TURBO_FACTOR=60.
; El ciclo completo Egg→Baby→Kid→Adult→Old→Dead se completa en ~minutos
; en lugar de ~días. Solo para validación en hardware — NO producción.
;
; FIRMWARE_VERSION: 0x03FE (verificado por static_assert en main_esp32.cpp).
; Flashear: pio run -e esp32s3_turbo -t upload
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3_turbo]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -D TURBO_MODE
    -D TURBO_FACTOR=60

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 OTA upload via WiFi — Fase 5.
;
; Requiere:
;   1. include/secrets.h con WIFI_SSID y OTA_PASSWORD no vacíos.
;   2. Placa conectada a la red y accesible como tamagotchi.local.
;
; Uso:
;   pio run -e esp32s3_ota -t upload
;
; Si la placa no es accesible por mDNS, usar IP directa:
;   upload_port = 192.168.x.x  (ver IP en monitor serie al boot con WiFi activo)
;
; OTA_PASSWORD se pasa como env var del sistema (no hardcodeada en ini).
; Exportar antes de flashear:
;   export OTA_PASSWORD="tu_password_ota"
;   pio run -e esp32s3_ota -t upload
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = tamagotchi.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
