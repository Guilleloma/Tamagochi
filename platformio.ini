; Tamagochi — PlatformIO configuration
; Target: ideaspark ESP8266 0.96" OLED Module V3.2 (ESP-12E)
;
; Versiones de librerías fijadas con ^ (minor/patch updates ok, major bloqueado):
;   - U8g2 @^2.35.30  : versión mínima probada con SSD1306 I2C full-buffer + XBM
;   - OneButton @^2.6.1: soporta short/long/double press con debounce configurable
;
; board_build.filesystem = littlefs — requerido desde Fase 1 (persistencia).
; Declarado ya en Fase 0 para no tener que reformat la flash después.
;
; upload_speed = 460800 — estable con CH340G a través de hub USB.
;   921600 funciona en conexión directa, pero falla con "Invalid head of packet" vía hub.
; f_cpu = 80000000L — 80MHz. No activar 160MHz: no hay ganancia real en render I2C
;   y aumenta el consumo innecesariamente (Fase 4 lo confirma con multímetro).

[env:esp12e]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -D NDEBUG
    ; -I include: PlatformIO añade include/ al main.cpp pero NO a las libs.
    ;   DisplayRenderer necesita sprites_generated.h desde include/.
    -I include
; El bring-up ESP32-S3 (Arduino_GFX) NO compila en ESP8266: excluirlo del filtro.
build_src_filter =
    +<*>
    -<bringup_esp32s3.cpp>
; lib_extra_dirs expone los módulos internos al LDF para que los includes entre
; capas (p.ej. domain incluyendo Logger de core) se resuelvan correctamente.
lib_extra_dirs =
    lib/core
    lib/domain
    lib/ui
    lib/infra
lib_deps =
    olikraus/U8g2@^2.35.30
    mathertel/OneButton@^2.6.1
    bblanchon/ArduinoJson@^7.0.4
    ; ESPAsyncWebServer + dep ESPAsyncTCP — servidor HTTP async para Fase 3.
    ; URLs de GitHub directas (los nombres con espacios fallan en el LDF).
    https://github.com/me-no-dev/ESPAsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNIT_TEST
    -DLOG_LEVEL=0
    ; -I explícitos: el LDF de PlatformIO en env:native no resuelve includes
    ; entre módulos sin ayuda (lib_extra_dirs solo influye en lib_deps).
    -Ilib/core/Logger
    -Ilib/domain/Persistence
    -Ilib/domain/StatsEngine
    -Ilib/core/EventBus
    -Ilib/domain/LifeFSM
    -Ilib/infra/WebUI
    ; macOS only: fuerza la búsqueda de libc++ en el SDK de Xcode CLT para evitar
    ; conflictos con la libc++ del toolchain de PlatformIO en env:native.
    ; En Linux/CI la ruta no existe y el flag se ignora silenciosamente (tests pasan).
    -isystem /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/include/c++/v1
build_src_filter =
    +<*>
    -<main.cpp>
    -<bringup_esp32s3.cpp>
    -<../lib/infra/OTAManager/>
    -<../lib/infra/WifiManager/>
    -<../lib/infra/WebUI/WebUI.cpp>
    -<../lib/ui/InputHandler/>
    -<../lib/ui/DisplayRenderer/>
    -<../lib/domain/Persistence/LittleFsStorage.cpp>
lib_compat_mode = off
lib_extra_dirs =
    lib/core
    lib/domain
    lib/infra
lib_deps =
    ; ArduinoJson v7 header-only: compatible con host-native para JsonCodec/tests.
    bblanchon/ArduinoJson@^7.0.4

[env:esp12e_turbo]
extends = env:esp12e
build_flags =
    ${env:esp12e.build_flags}
    -D TURBO_MODE
    -D TURBO_FACTOR=60

; OTA upload via WiFi — requiere placa conectada a la red y password en env var.
; Uso:  OTA_PASSWORD="tu_password" pio run -e esp12e_ota -t upload
; Si la password no está en la env var, esptool fallará con "auth failed".
[env:esp12e_ota]
extends = env:esp12e
upload_protocol = espota
upload_port = tamagotchi.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 bring-up — FASE 0: pantalla TFT color (JD9853 / 240×296 IPS)
; Waveshare ESP32-S3 Zero, 4MB flash QIO, 2MB PSRAM quad.
;
; build_src_filter: SOLO compila bringup_esp32s3.cpp — main.cpp (ESP8266)
; queda excluido y no rompe la compilación cruzada.
;
; Flashear: pio run -e esp32s3 -t upload
;   Si el upload falla, poner placa en modo bootloader manual:
;   mantén presionado BOOT → pulsa RESET → suelta BOOT → correr pio upload.
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem101
upload_port = /dev/cu.usbmodem101
board_build.mcu = esp32s3
board_build.flash_mode = qio
; ── Flash size: el chip real es ESP32-S3FH4R2 = 4MB ──────────────────────────
; El board JSON (esp32-s3-devkitc-1) asume 8MB en DOS sitios:
;   - upload.flash_size = 8MB  → esptool lo estampa en el header de la imagen.
;   - build.partitions = default_8MB.csv → tabla de particiones de 8MB.
; Si solo se override board_build.flash_size, el header SIGUE en 8MB y al
; arrancar la ROM detecta flash(4MB) < header(8MB) → assert do_core_init →
; boot loop infinito (setup() NUNCA corre, pantalla negra). Hay que override
; AMBOS: el flash_size de upload Y la tabla de particiones a una de 4MB.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.filesystem = littlefs
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -I include
; SOLO compila el sketch ESP32-S3. main.cpp (ESP8266) excluido.
build_src_filter = -<*> +<bringup_esp32s3.cpp>
; lib_ldf_mode = deep (default): el LDF escanea todas las libs declaradas en
; lib_extra_dirs en busca de dependencias del sketch.
; lib_ignore bloquea explícitamente los módulos que NO deben compilarse aquí:
;   - DisplayRenderer: depende de U8g2 (solo ESP8266/OLED)
;   - InputHandler:    depende de OneButton + U8g2 (solo ESP8266)
;   - Los módulos de domain/infra/core (LifeFSM, Persistence, etc.) tampoco
;     son necesarios en este env y tienen dependencias rotas en ESP32.
; SpriteStore sí se compila porque el sketch la incluye (#include "SpriteStore.h")
; y el LDF la encuentra vía lib_extra_dirs.
lib_ignore =
    DisplayRenderer
    InputHandler
    Logger
    EventBus
    StatsEngine
    LifeFSM
    Persistence
    WebUI
    OTAManager
    WifiManager
lib_extra_dirs =
    lib/ui
    lib/core
    lib/domain
    lib/infra
lib_deps =
    ; GFX 1.3.7 (GitHub tag): última versión 1.3.x — compatible con framework 3.20017 (IDF 4.4.x).
    ; GFX 1.4.x+ introduce esp_private/periph_ctrl.h y bugs en Arduino_ESP32RGBPanel
    ; con core 2.x. Subir a >=1.4.x cuando se migre a Arduino-ESP32 core 3.x (IDF5).
    https://github.com/moononournation/Arduino_GFX.git#v1.3.7
    bblanchon/ArduinoJson@^7.0.4
    LittleFS
